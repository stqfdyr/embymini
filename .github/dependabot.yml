version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # Every gpui-kit release may move to a GPUI snapshot with a different API: pinned exactly, bumped by hand
      - dependency-name: "gpui-kit*"
      - dependency-name: "gpui-pre-*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # The Rust version is pinned on purpose and bumped by hand together with the local toolchain
      - dependency-name: dtolnay/rust-toolchain

version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # The Rust version is pinned on purpose and bumped by hand together with the local toolchain
      - dependency-name: dtolnay/rust-toolchain

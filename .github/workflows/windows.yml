# Windows 安装包：前端检查 → 下载 mpv（shinchiro 构建，mpv 官网推荐的 Windows 版本）放进资源目录 →
# Rust 测试（含自带 mpv 配置在 Windows 上的加载检查）→ mpv 渲染截图 → clippy → tauri build（NSIS）→
# 上传安装包 → 冒烟测试（静默安装、启动、查日志、截图）→（仅 v* 标签）发 Release。
# 发版：先把 tauri.conf.json 与 Cargo.toml 的 version 改成新版本并推 main，再 git tag -a vX.Y.Z -m vX.Y.Z && git push origin vX.Y.Z。
name: windows
# 只在需要安装包时跑（Windows release 构建 15–25 分钟）：手动触发，或推送 v* 标签。平时推送 main 不构建。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # 发 Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 发 Release 时要找上一个标签，列出这一版的提交

      # 标签与程序版本不一致时尽早失败：安装包文件名、关于页、UA 里的版本号都取自这两个文件
      - name: 核对版本号（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          # Windows 上检出的文件是 CRLF，先去掉 \r 再匹配
          conf=$(tr -d '\r' < src-tauri/tauri.conf.json | sed -n 's/^  "version": "\(.*\)",$/\1/p')
          cargo=$(tr -d '\r' < src-tauri/Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)
          echo "标签 $tag，tauri.conf.json $conf，Cargo.toml $cargo"
          if [ "$tag" != "$conf" ] || [ "$tag" != "$cargo" ]; then
            echo "版本号不一致：先把 tauri.conf.json 与 Cargo.toml 的 version 改成 $tag 再打标签" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
        working-directory: ui
      - run: npm run check
        working-directory: ui
      - run: npm test
        working-directory: ui

      - name: 下载 mpv.exe 到 src-tauri/mpv/
        shell: pwsh
        # 带本次运行的 token 查询：runner 出口 IP 共用，不带 token 时每小时 60 次的匿名额度常被耗尽（实测撞上过）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = Invoke-RestMethod https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
          # x86_64-v3：AVX2 优化的构建（2013 年以后的 CPU 都支持），软解和缩放更快
          $asset = $rel.assets | Where-Object name -match '^mpv-x86_64-v3-\d{8}-git-.*\.7z$' | Select-Object -First 1
          if (-not $asset) { throw '没找到 mpv 构建' }
          Write-Host "mpv: $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv.7z
          7z e mpv.7z mpv.exe -osrc-tauri/mpv -y

      # 含 bundled_config_loads：在真 Windows 上验证自带 mpv 配置 / ModernZ 能加载（含中文空格路径、配置零报错（d3d11-adapter 在无 N 卡机器上的报错除外））
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: mpv 实际渲染截图（ModernZ、选集菜单；无显卡时走 WARP）
        shell: pwsh
        continue-on-error: true # 只为留证据，runner 没有桌面时不影响出包
        timeout-minutes: 3
        run: |
          $env:SHOT_DIR = Join-Path $PWD 'smoke'; New-Item -ItemType Directory -Force $env:SHOT_DIR | Out-Null
          $p = Start-Process -FilePath "$PWD\src-tauri\mpv\mpv.exe" -PassThru -ArgumentList @(
            "--config-dir=$PWD\src-tauri\mpv", "--script=$PWD\tools\mpv-shot.lua", '--force-window=yes', '--ao=null',
            "--log-file=$env:SHOT_DIR\mpv-render.log", '--force-media-title="浴血黑帮 S01E01 测试"', 'av://lavfi:testsrc2=duration=60:size=1920x1080')
          if (-not $p.WaitForExit(60000)) { Stop-Process $p.Id; Write-Host 'mpv 60 秒没退出（截图脚本没跑完），已结束' }
          else { Write-Host "mpv 退出码 $($p.ExitCode)" }
          Select-String -Path "$env:SHOT_DIR\mpv-render.log" -Pattern '\]\[e\]\[|d3d11|Using hardware|VO:' | ForEach-Object Line
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # 同时生成自动更新用的签名（<安装包>.sig）；私钥只在 Secrets 里，丢了就发不了能自动更新的版本
      - name: 打包
        shell: cmd
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 诊断数据上报地址和 token（编进程序）；没设时设置里不显示「发送诊断数据」
          EMBYMINI_TEL_URL: ${{ secrets.EMBYMINI_TEL_URL }}
          EMBYMINI_TEL_TOKEN: ${{ secrets.EMBYMINI_TEL_TOKEN }}
        run: ui\node_modules\.bin\tauri.cmd build

      - uses: actions/upload-artifact@v4
        with:
          name: EmbyMini-setup
          path: src-tauri/target/release/bundle/nsis/*-setup.exe*

      # 冒烟：像用户一样静默安装、启动，确认程序起得来、资源路径正确（资源目录带 \\?\ 前缀导致 mpv 读不到自带配置时，这一步会直接失败）
      - name: 冒烟测试：静默安装 → 启动 → 查日志、截图
        shell: pwsh
        timeout-minutes: 10
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\EmbyMini" -Recurse -Filter embymini.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "安装后找不到 embymini.exe（$env:LOCALAPPDATA\EmbyMini）" }
          Write-Host "已安装：$($exe.FullName)"
          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep 15
          New-Item -ItemType Directory -Force smoke | Out-Null
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\smoke\app.png")
          } catch { Write-Host "截图失败（不影响判断）：$_" }
          # 所有数据在安装目录下的 data\，系统盘的旧位置不应再出现
          $logFile = Join-Path $exe.DirectoryName 'data\logs\EmbyMini.log'
          if (-not (Test-Path $logFile)) { throw "日志不在安装目录的 data\logs 下：$logFile" }
          $log = Get-Content $logFile -Raw -Encoding utf8
          Write-Host $log
          Copy-Item $logFile smoke/
          if ($app.HasExited) { throw "程序启动后退出了（退出码 $($app.ExitCode)）" }
          Stop-Process $app.Id
          if ($log -notmatch '自带 mpv 配置：([A-Z]:\\[^\r\n]*)') { throw '日志里没有正确的自带 mpv 配置路径（带 \\?\ 前缀或没找到）' }
          if (-not (Test-Path "$($Matches[1])\scripts\modernz.lua")) { throw "配置目录里没有 ModernZ：$($Matches[1])" }
          foreach ($d in "$env:APPDATA\com.stqfdyr.embymini", "$env:LOCALAPPDATA\com.stqfdyr.embymini") {
            if (Test-Path $d) { throw "系统盘上还有数据目录：$d" }
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: smoke/

      # 冒烟通过才发；版本号带 - 的（如 v0.2.0-beta.1）标为预发布（客户端检查更新只看正式版）。
      # 说明 = 安装提示 + 上一个标签以来的提交标题；latest.json 是客户端检查更新读的文件（版本、说明、安装包地址和签名）
      - name: 发布 Release（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          prev=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)
          changes=$(git log --no-merges --format='- %s' ${prev:+"$prev.."}"$tag")
          cd src-tauri/target/release/bundle/nsis
          exe=$(ls *-setup.exe)
          sha256sum "$exe" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          jq -n --arg v "${tag#v}" --arg n "$changes" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg s "$(cat "$exe.sig")" --arg u "https://github.com/$GH_REPO/releases/download/$tag/$exe" \
            '{version: $v, notes: $n, pub_date: $d, platforms: {"windows-x86_64": {signature: $s, url: $u}}}' > latest.json
          cat latest.json
          pre=()
          case "$tag" in *-*) pre=(--prerelease) ;; esac
          notes="**安装**：下载 \`$exe\` 运行即可；覆盖安装会保留服务器配置，0.2.0 起程序里「设置 → 关于」可以检查更新。安装包没有签名，Windows 可能提示「已保护你的电脑」，点「更多信息」→「仍要运行」。

          **校验**：\`SHA256SUMS.txt\` 里是安装包的 SHA-256。

          ## 更新内容

          $changes"
          gh release create "$tag" "$exe" "$exe.sig" SHA256SUMS.txt latest.json --verify-tag \
            --title "EmbyMini $tag" --notes "$notes" ${pre[@]+"${pre[@]}"}

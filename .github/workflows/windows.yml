# Windows installer: frontend checks → clippy → fetch mpv (shinchiro build, the one mpv.io recommends) into the
# resource dir → Rust tests (incl. loading the bundled mpv config on real Windows) → mpv render screenshot →
# tauri build (NSIS) → upload → smoke test (silent install, launch, check log, screenshot) → (v* tags only) Release.
# Releasing: bump `version` in tauri.conf.json and Cargo.toml, push main, then
# git tag -a vX.Y.Z -m vX.Y.Z && git push origin vX.Y.Z.
name: windows
# Only when an installer is wanted (a Windows release build takes 15–25 min): manual runs or v* tags, never on push to main.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # create the Release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the Release notes list commits since the previous tag

      # Fail early when the tag and app version disagree: installer name, About page and UA all read these two files
      - name: 核对版本号（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          # Checkout on Windows is CRLF; strip \r before matching
          conf=$(tr -d '\r' < src-tauri/tauri.conf.json | sed -n 's/^  "version": "\(.*\)",$/\1/p')
          cargo=$(tr -d '\r' < src-tauri/Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)
          echo "标签 $tag，tauri.conf.json $conf，Cargo.toml $cargo"
          if [ "$tag" != "$conf" ] || [ "$tag" != "$cargo" ]; then
            echo "版本号不一致：先把 tauri.conf.json 与 Cargo.toml 的 version 改成 $tag 再打标签" >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # Pinned: a new Rust release invalidates the whole build cache (v0.3.0 took 19 min) and new lints can break -D warnings.
      # Bump by hand together with the local toolchain.
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
        working-directory: ui
      - run: npm run check
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run knip
        working-directory: ui

      # Before the test build so a lint failure stops the run early
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: 下载 mpv.exe 到 src-tauri/mpv/
        shell: pwsh
        # Authenticated: runners share egress IPs and the anonymous 60/hour quota does run out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = Invoke-RestMethod https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
          # x86_64-v3: AVX2 build (any CPU since 2013), faster software decoding and scaling
          $asset = $rel.assets | Where-Object name -match '^mpv-x86_64-v3-\d{8}-git-.*\.7z$' | Select-Object -First 1
          if (-not $asset) { throw '没找到 mpv 构建' }
          Write-Host "mpv: $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv.7z
          7z e mpv.7z mpv.exe -osrc-tauri/mpv -y

      # Includes bundled_config_loads: the bundled mpv config / ModernZ load on real Windows from a path with CJK and
      # spaces, with zero config errors (except d3d11-adapter on machines without an NVIDIA GPU)
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: mpv 实际渲染截图（ModernZ、选集菜单；无显卡时走 WARP）
        shell: pwsh
        continue-on-error: true # evidence only; a runner without a desktop must not block the installer
        timeout-minutes: 3
        run: |
          $env:SHOT_DIR = Join-Path $PWD 'smoke'; New-Item -ItemType Directory -Force $env:SHOT_DIR | Out-Null
          $p = Start-Process -FilePath "$PWD\src-tauri\mpv\mpv.exe" -PassThru -ArgumentList @(
            "--config-dir=$PWD\src-tauri\mpv", "--script=$PWD\tools\mpv-shot.lua", '--force-window=yes', '--ao=null',
            "--log-file=$env:SHOT_DIR\mpv-render.log", '--force-media-title="浴血黑帮 S01E01 测试"', 'av://lavfi:testsrc2=duration=60:size=1920x1080')
          if (-not $p.WaitForExit(60000)) { Stop-Process $p.Id; Write-Host 'mpv 60 秒没退出（截图脚本没跑完），已结束' }
          else { Write-Host "mpv 退出码 $($p.ExitCode)" }
          Select-String -Path "$env:SHOT_DIR\mpv-render.log" -Pattern '\]\[e\]\[|d3d11|Using hardware|VO:' | ForEach-Object Line

      # Also signs the installer for the updater (<installer>.sig); the private key lives only in Secrets —
      # lose it and existing installs can no longer auto-update
      - name: 打包
        shell: cmd
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ui\node_modules\.bin\tauri.cmd build

      - uses: actions/upload-artifact@v7
        with:
          name: EmbyMini-setup
          path: src-tauri/target/release/bundle/nsis/*-setup.exe*

      # Smoke: install silently and launch like a user; catches a broken resource path (e.g. a \\?\ prefix that mpv cannot read)
      - name: 冒烟测试：静默安装 → 启动 → 查日志、截图
        shell: pwsh
        timeout-minutes: 10
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\EmbyMini" -Recurse -Filter embymini.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "安装后找不到 embymini.exe（$env:LOCALAPPDATA\EmbyMini）" }
          Write-Host "已安装：$($exe.FullName)"
          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep 15
          New-Item -ItemType Directory -Force smoke | Out-Null
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\smoke\app.png")
          } catch { Write-Host "截图失败（不影响判断）：$_" }
          # All data lives in data\ under the install dir; the old system-drive locations must not reappear
          $logFile = Join-Path $exe.DirectoryName 'data\logs\EmbyMini.log'
          if (-not (Test-Path $logFile)) { throw "日志不在安装目录的 data\logs 下：$logFile" }
          $log = Get-Content $logFile -Raw -Encoding utf8
          Write-Host $log
          Copy-Item $logFile smoke/
          if ($app.HasExited) { throw "程序启动后退出了（退出码 $($app.ExitCode)）" }
          Stop-Process $app.Id
          if ($log -notmatch '自带 mpv 配置：([A-Z]:\\[^\r\n]*)') { throw '日志里没有正确的自带 mpv 配置路径（带 \\?\ 前缀或没找到）' }
          if (-not (Test-Path "$($Matches[1])\scripts\modernz.lua")) { throw "配置目录里没有 ModernZ：$($Matches[1])" }
          foreach ($d in "$env:APPDATA\com.stqfdyr.embymini", "$env:LOCALAPPDATA\com.stqfdyr.embymini") {
            if (Test-Path $d) { throw "系统盘上还有数据目录：$d" }
          }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke
          path: smoke/

      # Only after the smoke test passes; tags with a - (e.g. v0.2.0-beta.1) become pre-releases, which the updater ignores.
      # Notes = install hint + commit subjects since the previous tag; latest.json is what the updater reads
      # (version, notes, installer URL and signature)
      - name: 发布 Release（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          prev=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)
          changes=$(git log --no-merges --format='- %s' ${prev:+"$prev.."}"$tag")
          cd src-tauri/target/release/bundle/nsis
          exe=$(ls -- *-setup.exe)
          sha256sum "$exe" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          jq -n --arg v "${tag#v}" --arg n "$changes" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg s "$(cat "$exe.sig")" --arg u "https://github.com/$GH_REPO/releases/download/$tag/$exe" \
            '{version: $v, notes: $n, pub_date: $d, platforms: {"windows-x86_64": {signature: $s, url: $u}}}' > latest.json
          cat latest.json
          pre=()
          case "$tag" in *-*) pre=(--prerelease) ;; esac
          notes="**安装**：下载 \`$exe\` 运行即可；覆盖安装会保留服务器配置，0.2.0 起程序里「设置 → 关于」可以检查更新。安装包没有签名，Windows 可能提示「已保护你的电脑」，点「更多信息」→「仍要运行」。

          **校验**：\`SHA256SUMS.txt\` 里是安装包的 SHA-256。

          ## 更新内容

          $changes"
          gh release create "$tag" "$exe" "$exe.sig" SHA256SUMS.txt latest.json --verify-tag \
            --title "EmbyMini $tag" --notes "$notes" ${pre[@]+"${pre[@]}"}

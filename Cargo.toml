# Workspace for the GPUI app. src-tauri is the current release app and keeps its own lockfile until the switch.
[workspace]
members = ["crates/app"]
exclude = ["src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"
publish = false

[profile.release]
lto = true
codegen-units = 1
strip = true

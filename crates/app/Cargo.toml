[package]
# The binary must stay embymini.exe: the installer and the updater of existing installs expect that name.
name = "embymini"
version.workspace = true
description = "Emby 桌面客户端：浏览 + mpv 播放"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Exact pin: every gpui-kit release may move to a GPUI snapshot with a different API.
gpui-kit = "=0.10.0"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
log = "0.4"
reqwest = { version = "0.13", features = ["json", "query", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[build-dependencies]
winresource = "0.1"

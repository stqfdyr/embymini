[package]
name = "embymini-core"
description = "EmbyMini 后端：服务器与配置、Emby 接口、图片缓存、本地缓存代理、mpv 播放、弹幕"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "query", "gzip", "socks"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
dunce = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
# Retry-After as an HTTP date; already in the tree via hyper
httpdate = "1"
sysinfo = { version = "0.38", default-features = false, features = ["disk"] }
# Local caching proxy (stream.rs): already in the tree via reqwest, only the server side is enabled
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
bytes = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

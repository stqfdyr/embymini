[package]
name = "embymini"
version = "0.4.0"
description = "Emby 桌面客户端：浏览 + mpv 播放"
edition = "2024"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "query", "gzip", "socks"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
dunce = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tauri-plugin-updater = "2"
flate2 = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
# 本地缓存代理（stream.rs）：树里本来就有，只打开服务端
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
bytes = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

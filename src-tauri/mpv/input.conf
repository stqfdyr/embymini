# 上一集 / 下一集 / 选集都交给 EmbyMini：队列是整季，mpv 播放列表里只有已加载的几集（见 player.rs）。
>             script-message embymini-next
ENTER         script-message embymini-next
NEXT          script-message embymini-next
MBTN_FORWARD  script-message embymini-next
<             script-message embymini-prev
PREV          script-message embymini-prev
MBTN_BACK     script-message embymini-prev
# mpv 自带的播放列表显示会露出直链 URL，换成选集菜单（scripts/embymini.lua）
F8            script-message-to embymini menu
g-p           script-message-to embymini menu

# ←→ 5 秒，并让 ModernZ 显示进度条（它会吞掉加载后的第一次 seek，第一次按键就没反馈）
RIGHT         seek  5; script-message-to modernz osc-show
LEFT          seek -5; script-message-to modernz osc-show
# ↑↓ 调音量（常见桌面播放器的习惯；mpv 默认是快进快退 1 分钟）；提示用中文
UP            no-osd add volume  5; show-text "音量 ${volume}%"
DOWN          no-osd add volume -5; show-text "音量 ${volume}%"
WHEEL_UP      no-osd add volume  2; show-text "音量 ${volume}%"
WHEEL_DOWN    no-osd add volume -2; show-text "音量 ${volume}%"
m             no-osd cycle mute; show-text "${?mute==yes:已静音}${?mute==no:取消静音}"
[             no-osd multiply speed 1/1.1; show-text "速度 ${speed}×"
]             no-osd multiply speed 1.1; show-text "速度 ${speed}×"
BS            no-osd set speed 1; show-text "速度 ${speed}×"

# 续播点由 EmbyMini 回传服务器，不用 mpv 自己的 watch-later（以服务器记录为准，也不额外写文件）
Q             quit

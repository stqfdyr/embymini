# EmbyMini 自带的 mpv 配置（启动时用 --config-dir 指向本目录，不读独立安装的 mpv 的配置）。
# 本目录随安装包更新、升级会被覆盖。个人调整写进设置页显示的「个人 mpv 配置」文件：在本文件之后加载，
# 同名选项以它为准，升级不覆盖。队列、续播点、字幕挂载由 EmbyMini 通过 IPC 控制，不要在配置里设置。

# 界面：ModernZ 替换自带的 OSC（scripts/modernz.lua + fonts/modernz-icons.ttf）
osc=no
osd-bar=no
border=yes
title-bar=no
# 鼠标停 2.5 秒后光标和控制栏一起隐藏（与 modernz.conf 的 hidetimeout 一致）
cursor-autohide=2500
# ModernZ 自己调字幕位置避让控制栏，不让 watch-later 记住 sub-pos（否则它每次启动都报冲突警告）
watch-later-options-remove=sub-pos
# 窗口标题（任务栏、顶栏中间）只用片名，不带「- mpv」；EmbyMini 用 force-media-title 设成「剧名 SxxExx 集名」
title=${?media-title:${media-title}}${!media-title:EmbyMini}
keep-open=no
save-position-on-quit=no
# 不调 yt-dlp：Emby 直链打不开时它只会白白多试几次
ytdl=no
# 截图（s 键）存到桌面。不设的话存到当前目录，可能落进安装目录：卸载时被删，安装目录也删不干净
screenshot-directory=~~desktop/

# 窗口：比例跟视频走（宽银幕、4:3 都不留黑边），大小统一放进屏幕的 75%×75%，
# 不按片源像素开窗（否则 720p 只有半屏、4K 超出屏幕）。拖动边缘保持比例、换集分辨率变了自动调整都是 mpv 默认行为
autofit=75%x75%

# 画面：gpu-next 渲染（Windows 上走 D3D11），硬解优先（D3D11VA，NVIDIA 上即 NVDEC），失败自动回退软解
vo=gpu-next
hwdec=auto-safe
# 双显卡笔记本：优先用 NVIDIA 独显渲染和解码（mpv 不会自己选独显）。没有 NVIDIA 显卡时 mpv 报
# 「No adapter matching 'NVIDIA'」并忽略这一项，照常用默认显卡（Windows CI 实测）
# （Windows 专用选项。Linux 上 mpv 报 option not found，同样不影响播放；
#   不放进条件 profile：那样可能在窗口创建之后才生效，就选不上独显了）
d3d11-adapter=NVIDIA
# 丝滑播放：按屏幕刷新率微调播放速度消除抖动（24 帧片在 60Hz 屏上不再一顿一顿），
# 高刷屏（120/165Hz）上再用插帧把帧间过渡均匀开（oversample 很省，核显也带得动）
video-sync=display-resample
interpolation=yes
tscale=oversample

# 字幕和音轨的默认值。EmbyMini 会按服务器给出的默认轨覆盖，这里只在服务器没给时生效
slang=zh-CN,zh-Hans,zh-Hant,zh,chi,chs,cht,zho
alang=zh-CN,zh,chi,ja,jpn,en,eng
sub-auto=no

# 弱网：视频经 EmbyMini 的本地缓存读（边播边整片落盘、上游卡住 3 秒就另开连接，见设置里的「边播边缓存整个视频」），
# 这里是 mpv 自己的内存预读：5 分钟 + 断线重连 + 提前打开下一集。
# 预读长度由 cache-secs 决定（开了缓存时 demuxer-readahead-secs 不起作用，不设 cache-secs 会一直读到
# demuxer-max-bytes 为止）。高码率片源先碰 1GiB 上限（80 Mbps 约 110 秒）。预读满之后按播放速度边播边读。
# network-timeout 取 10 秒：本地缓存等不到上游数据时 10 秒后断开重连，不干等默认的 60 秒（本地缓存起不来、直连上游时同样适用）。
cache=yes
cache-secs=300
demuxer-max-bytes=1GiB
demuxer-max-back-bytes=256MiB
network-timeout=10
stream-lavf-o=reconnect=1,reconnect_streamed=1,reconnect_on_network_error=1,reconnect_delay_max=30
prefetch-playlist=yes

# EmbyMini's bundled mpv config, loaded with --config-dir (a separately installed mpv's config is not read).
# This directory is replaced on every update. Personal settings go in the personal mpv.conf shown on the settings
# page: it loads after this file, wins for the same option and survives updates. The queue, resume position and
# subtitle loading are driven by EmbyMini over IPC; don't set them here.

# UI: ModernZ replaces the built-in OSC (scripts/modernz.lua + fonts/modernz-icons.ttf)
osc=no
osd-bar=no
border=yes
title-bar=no
# Hide the cursor together with the controls after 2.5 s idle (same as hidetimeout in modernz.conf)
cursor-autohide=2500
# ModernZ moves subtitles clear of the controls itself and warns on every start if watch-later remembers sub-pos
watch-later-options-remove=sub-pos
# Window title is the media title only, no "- mpv"; EmbyMini sets force-media-title to "Show SxxExx Episode"
title=${?media-title:${media-title}}${!media-title:EmbyMini}
# The client advances the queue on end-file
keep-open=no
# The server keeps the resume position; mpv must not write its own (Q is plain quit in input.conf for the same reason)
save-position-on-quit=no
# No yt-dlp: on a dead Emby link it would only retry a few more times
ytdl=no
# Screenshots (s) to the desktop; the default is the working directory, which may be the install directory
# (deleted on uninstall, and then the directory is not removed cleanly)
screenshot-directory=~~desktop/

# Window: fit 75%x75% of the screen at the video's aspect ratio instead of opening at the source's pixel size
# (720p would be half a screen, 4K larger than it)
autofit=75%x75%

# Rendering: gpu-next (D3D11 on Windows), hardware decoding first (D3D11VA, NVDEC on NVIDIA), software fallback
vo=gpu-next
hwdec=auto-safe
# Hybrid-graphics laptops: render and decode on the NVIDIA GPU (mpv does not pick it). Without one mpv logs
# "No adapter matching 'NVIDIA'" and uses the default (Windows CI). Windows-only: Linux logs "option not found",
# also harmless. Not in a conditional profile: that may apply after the window exists, too late to pick the GPU
d3d11-adapter=NVIDIA
# Smooth playback: resample to the display rate (24 fps on 60 Hz no longer judders); on high refresh screens
# interpolate between frames (oversample is cheap enough for integrated graphics)
video-sync=display-resample
interpolation=yes
tscale=oversample

# Track defaults, used only when the server names no default track (EmbyMini applies the server's choice)
slang=zh-CN,zh-Hans,zh-Hant,zh,chi,chs,cht,zho
alang=zh-CN,zh,chi,ja,jpn,en,eng
sub-auto=no

# Weak networks: video is read through EmbyMini's local cache (stores the whole file while playing, opens another
# upstream connection after a 3 s stall). This is mpv's own in-memory read-ahead: 5 minutes, reconnect, open the
# next episode early.
# cache-secs sets the read-ahead (with the cache on demuxer-readahead-secs has no effect; without cache-secs mpv
# reads until demuxer-max-bytes). High bitrates hit 1GiB first (about 110 s at 80 Mbps); once full it reads at
# playback speed.
# network-timeout 10: reconnect after 10 s without data instead of the default 60 s (the local cache waiting on
# upstream, or the direct fallback when the cache is not running)
cache=yes
cache-secs=300
demuxer-max-bytes=1GiB
demuxer-max-back-bytes=256MiB
network-timeout=10
stream-lavf-o=reconnect=1,reconnect_streamed=1,reconnect_on_network_error=1,reconnect_delay_max=30
prefetch-playlist=yes

# 进度条悬停预览（scripts/thumbfast.lua，ModernZ 自动接上）：另起一个无窗口的 mpv 读同一个直链，
# 只解码悬停位置附近的关键帧。不依赖服务器预生成的缩略图（多数服务器没有开），在本机现解。
# 直链都是网络流，默认对网络流不启用，这里打开
network=yes
# 预览图最大尺寸（逻辑像素，高分屏按缩放放大）：16:9 片源是 256×144，和常见流媒体网页播放器的预览差不多大
max_width=256
max_height=144
# 软解：每次只解一帧，CPU 足够快；硬解在无窗口的子进程里不一定可用
hwdec=no
# 鼠标第一次悬停进度条时才启动，不在开播时多开一条连接和上游抢带宽
spawn_first=no

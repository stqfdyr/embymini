# Seekbar hover previews (scripts/thumbfast.lua, picked up by ModernZ): a windowless mpv reads the same stream and
# decodes the keyframe near the hovered position, so no server-side thumbnails are needed (most servers have none).
# Every stream is a network stream, which thumbfast skips by default
network=yes
# Maximum size in logical pixels (scaled on HiDPI): 256x144 for 16:9, about the size of common web players
max_width=256
max_height=144
# Software decoding: one frame at a time is cheap, and hwdec may be unavailable in a windowless process
hwdec=no
# Start on the first hover, not at playback start, so it doesn't compete with playback for bandwidth
spawn_first=no
